backend = "glx"
vsync = true

shadow = true;
shadow-radius = 6;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-opacity = 0.4;
# 排除不需要阴影的窗口
shadow-exclude = [ "class_g = 'Dunst'" ];

corner-radius = 6

fading = true
no-fading-openclose = true

inactive-opacity = 1
active-opacity = 1
detect-client-opacity = false;
opacity-rule = [
    "80:class_g = 'Rofi'",
    "90:class_g = 'Polybar'",
    "70:class_g = 'Alacritty' && !focused",
    "90:class_g = 'Alacritty' && focused",
    "100:class_g = 'i3lock'"
];

# 开启模糊
blur: {
  method = "dual_kawase";
  strength = 2;      # 模糊强度，通常 5-10 效果较好
  background = true; # 模糊窗口背景
  background-frame = false;
  background-fixed = false;
}
# blur-background-exclude = [ "class_g = 'Dunst'" ]
