;
;   ██████╗  ██████╗ ██╗  ██╗   ██╗██████╗  █████╗ ██████╗
;   ██╔══██╗██╔═══██╗██║  ╚██╗ ██╔╝██╔══██╗██╔══██╗██╔══██╗
;   ██████╔╝██║   ██║██║   ╚████╔╝ ██████╔╝███████║██████╔╝
;   ██╔═══╝ ██║   ██║██║    ╚██╔╝  ██╔══██╗██╔══██║██╔══██╗
;   ██║     ╚██████╔╝███████╗██║   ██████╔╝██║  ██║██║  ██║
;   ╚═╝      ╚═════╝ ╚══════╝╚═╝   ╚═════╝ ╚═╝  ╚═╝╚═╝  ╚═╝
;
;
;   To learn more about how to configure Polybar
;   go to https://github.com/polybar/polybar
;
;   The README contains a lot of information
;
;==========================================================

[colors]
background = #232A2E
background-alt = #2D353B
foreground = #C5C8C6
primary = #E97451
secondary = #B33951
alert = #F0C674
disabled = #707880

[bar/base]
width = 98.6%
height = 24pt
; radius = 6
; radius-top = 0
; radius-bottom = 0

offset-y = 0.8%
offset-x = 0.7%

wm-restack = bspwm
overrideredirect = true
bottom = true
fixed-center = true
margin-bottom = 0
margin-top = 0

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

border-size = 0pt
border-color = #00000000

padding-left = 2
padding-right = 2

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = "Maple Mono NF CN:size=11;2"
font-1 = "Maple Mono NF CN:size=12;3"

modules-left = xworkspaces xwindow
; modules-center = xwindow
modules-right = memory cpu brightness volume battery date systray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[system]
sys_battery = BATT
sys_adapter = ACAD
sys_monitor1 = HDMI-A-0
sys_monitor2 = eDP
sys_graphics_card = amdgpu_bl0

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html

[module/systray]
type = internal/tray

tray-size = 50%
format-margin = 0pt
tray-spacing = 4pt

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = true

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
; label = %class%
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:02%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:02%%
[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
interval = 1.0
accumulate-stats = true
unknown-as-up = true

format-connected = <ramp-signal> <label-connected>
format-connected-background = ${colors.background}
format-connected-padding = 0

label-connected = "%{A1:networkmanager_dmenu &:}%essid%%{A}"
label-disconnected = "%{A1:networkmanager_dmenu &:}Offline%{A}"

format-disconnected-prefix = "󰤭 "
format-disconnected-prefix-font = 2
format-disconnected-foreground = ${colors.foreground}
format-disconnected-background = ${colors.background}
format-disconnected-padding = 0

ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨
ramp-signal-font = 2
ramp-signal-foreground = ${colors.primary}
; click-left = rofi -dmenu -theme ~/.config/polybar/rofi/networkmenu.rasi
; click-right = kcmshell6 networkmanagement


[module/brightness]
type = internal/backlight

; 检查你的显卡名称，通常是 intel_backlight 或 amdgpu_bl0
card = ${system.sys_graphics_card}
use-actual-brightness = true
enable-scroll = true

format = <ramp> <label>
format-background = ${colors.background}
format-padding = 0

label = %percentage%%
label-foreground = ${colors.foreground}

; 使用 Nerd Font v3 的亮度梯度图标
ramp-0 = 󰃞
ramp-1 = 󰃞
ramp-2 = 󰃞
ramp-3 = 󰃟
ramp-4 = 󰃟
ramp-5 = 󰃟
ramp-6 = 󰃠
ramp-7 = 󰃠
ramp-8 = 󰃠
ramp-9 = 󰃠

ramp-font = 2
ramp-foreground = ${colors.primary}

[module/volume]
type = internal/pulseaudio
use-ui-max = true
interval = 2

format-volume = <ramp-volume> <label-volume>
; 如果你不需要背景色，保持注释即可
; format-volume-background = #303446
format-volume-padding = 0

; 音量图标渐变（从低到高）
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰕿
ramp-volume-2 = 󰕿
ramp-volume-3 = 󰖀
ramp-volume-4 = 󰖀
ramp-volume-5 = 󰖀
ramp-volume-6 = 󰕾
ramp-volume-7 = 󰕾
ramp-volume-8 = 󰕾
ramp-volume-9 = 󰕾
ramp-volume-font = 2
ramp-volume-foreground = ${colors.primary}

format-muted = <label-muted>
; 静音图标
format-muted-prefix = "󰝟"
format-muted-prefix-font = 2
format-muted-prefix-foreground = ${colors.primary}
format-muted-background = ${colors.background}
format-muted-padding = 0

label-muted = " "
label-muted-foreground = ${colors.foreground}

click-right = pavucontrol &

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %H:%M
; date-alt = %Y-%m-%d %H:%M:%S
date-alt = %A %b %d, %G

; label = %date%
; label-foreground = ${colors.primary}


format = <label>
format-prefix = "󱑔 "
format-prefix-font = 2
format-prefix-foreground = ${colors.primary}
label = %date%
label-font = 5
label-foreground = ${colors.foreground}

[module/battery]
type = internal/battery

full-at = 96

battery = ${system.sys_battery}
adapter = ${system.sys_adapter}
poll-interval = 2

format-charging = <label-charging>
format-charging-prefix = " "
format-charging-prefix-font = 2
format-charging-prefix-foreground = #a6da95

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-prefix-font = 2
format-discharging-prefix-foreground = #ed8796

format-full = <label-full>
format-full-prefix = " "
format-full-prefix-font = 2
format-full-prefix-foreground = #a6da95

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-font = 2

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini

[bar/monitor1]
inherit = bar/base
monitor = ${system.sys_monitor1}
modules-right = memory cpu brightness volume battery date systray


[bar/monitor2]
inherit = bar/base
monitor = ${system.sys_monitor2}
modules-right = memory cpu brightness volume battery date
